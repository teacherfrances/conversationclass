name: Update Friday Class activities

on:
  schedule:
    - cron: "23 * * * *"   # every hour
  workflow_dispatch:        # lets you run it now from the Actions tab
  push:
    paths:
      - scripts/build_activities.py

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build activities.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_activities.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain activities.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add activities.json
            git commit -m "Update Friday Class activity list"
            git push
          fi
