<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friday Conversation Class: Let&#x27;s Talk!</title>
<meta name="description" content="All 32 class activities in one place.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231B3A5C'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle'%3E💬%3C/text%3E%3C/svg%3E">
<style>
:root{
  --navy:#1B3A5C; --navy2:#12283f; --teal:#17868A; --tealD:#0E5F63; --tealT:#E4F2F2;
  --amber:#C07A12; --amberT:#FDF3E0; --amberL:#F2C98A; --panel:#F5F7F9; --line:#C9D4DE;
  --grey:#5A6772; --ink:#15212e; --paleblue:#DCE7F0;
  --display:"Segoe UI Black","Arial Black","Segoe UI",Carlito,Calibri,system-ui,sans-serif;
  --body:Calibri,Carlito,"Segoe UI",Candara,"Helvetica Neue",Arial,sans-serif;
}
html{font-size:28px;-webkit-text-size-adjust:100%}
html[data-size="2"]{font-size:34px}
html[data-size="3"]{font-size:42px}
*{box-sizing:border-box}
body{margin:0;background:var(--panel);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.35}
a{color:inherit}
.hero{background:var(--navy);color:#fff;padding:1.1rem 1rem 1.3rem;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-3rem;top:-3rem;width:10rem;height:10rem;border-radius:50%;
  background:radial-gradient(circle,rgba(23,134,138,.3),rgba(23,134,138,0) 70%);pointer-events:none}
.wrap{max-width:1500px;margin:0 auto}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:.6rem;flex-wrap:wrap}
.eyebrow{color:var(--amberL);font-family:var(--display);font-weight:900;letter-spacing:.06em;font-size:.72rem}
h1{font-family:var(--display);font-weight:900;font-size:1.9rem;line-height:1.05;margin:.25rem 0 .35rem}
.sub{color:var(--paleblue);font-size:1rem;margin:0}
.size{display:flex;gap:.3rem;position:relative;z-index:1}
.size button{min-width:2.3rem;min-height:2.3rem;border-radius:.5rem;border:2px solid rgba(255,255,255,.45);
  background:transparent;color:#fff;font-family:var(--display);font-weight:900;font-size:1rem;cursor:pointer;padding:0 .35rem}
.size button[aria-pressed="true"]{background:var(--amber);border-color:var(--amber)}
.size .lbl{align-self:center;color:var(--paleblue);font-size:.72rem;margin-right:.15rem}
nav.chips{position:sticky;top:0;z-index:5;background:#fff;border-bottom:2px solid var(--line);
  box-shadow:0 4px 14px rgba(27,58,92,.08)}
nav.chips .wrap{display:flex;gap:.4rem;overflow-x:auto;padding:.5rem 1rem;scrollbar-width:thin}
nav.chips a{flex:0 0 auto;display:flex;align-items:center;gap:.3rem;min-height:2.3rem;padding:.2rem .7rem;border-radius:999px;
  background:var(--tealT);color:var(--tealD);text-decoration:none;font-weight:700;font-size:1rem;border:2px solid transparent}
nav.chips a:hover,nav.chips a:focus-visible{border-color:var(--teal)}
nav.chips a.new{background:var(--amberT);color:#8a5210}
main{padding:.4rem 1rem 2rem}
section{scroll-margin-top:3.6rem;margin-top:1.1rem}
h2{display:flex;align-items:center;gap:.45rem;font-family:var(--display);font-weight:900;color:var(--navy);
  font-size:1.2rem;margin:0 0 .55rem;padding-bottom:.3rem;border-bottom:3px solid var(--navy)}
h2 .n{margin-left:auto;font-family:var(--body);font-size:.75rem;color:var(--grey);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,13rem),1fr));gap:.6rem}
.card{display:flex;gap:.6rem;align-items:center;background:#fff;border:2px solid var(--line);border-radius:.7rem;
  padding:.6rem .65rem;text-decoration:none;min-height:3.4rem;position:relative;
  transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}
.card:hover,.card:focus-visible{border-color:var(--teal);box-shadow:0 6px 18px rgba(23,134,138,.18);transform:translateY(-2px);outline:none}
.card:focus-visible{outline:4px solid var(--amber);outline-offset:2px}
.card:active{transform:translateY(0)}
.ico{flex:0 0 auto;width:2.2rem;height:2.2rem;border-radius:.55rem;background:var(--tealT);display:grid;place-items:center;font-size:1.2rem;line-height:1}
.txt{min-width:0}
.t{display:block;font-weight:700;color:var(--navy);font-size:1rem;line-height:1.15}
.d{display:block;color:var(--grey);font-size:.8rem;margin-top:.15rem}
.go{margin-left:auto;flex:0 0 auto;color:var(--teal);font-size:1.1rem;font-weight:900}
.badge{position:absolute;top:-.45rem;right:.5rem;background:var(--amber);color:#fff;font-family:var(--display);font-weight:900;
  font-size:.62rem;letter-spacing:.05em;padding:.05rem .4rem;border-radius:999px}
#newSec .card{border-color:var(--amberL);background:linear-gradient(#fff,#fffaf1)}
#newSec h2{border-color:var(--amber)}
@media (max-width:600px){
  html{font-size:24px} html[data-size="2"]{font-size:29px} html[data-size="3"]{font-size:35px}
  h1{font-size:1.6rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
html{scroll-behavior:smooth}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="top">
      <div>
        <div class="eyebrow">FRIDAY CONVERSATION CLASS</div>
        <h1>Let&#x27;s Talk!</h1>
        <p class="sub">Tap an activity to start.</p>
      </div>
      <div class="size" role="group" aria-label="Text size">
        <span class="lbl">Text</span>
        <button type="button" data-s="1" aria-label="Normal text">A</button>
        <button type="button" data-s="2" aria-label="Bigger text">A+</button>
        <button type="button" data-s="3" aria-label="Biggest text">A++</button>
      </div>
    </div>
  </div>
</header>
<nav class="chips" aria-label="Topics"><div class="wrap" id="chips"></div></nav>
<main><div class="wrap" id="list"></div></main>
<script>
var BASE = "https://teacherfrances.github.io/";
var SECTIONS = [["The last lap", "🏁", [["fridayclasslastlapintrodeck/", "Term 4: The Last Lap", "The lesson introduction.", "🏁", "2026-10-16"], ["fridayclasslastlapcampushunt/", "The Last Lap: Campus Hunt", "Find the places, use the expressions.", "🧭", "2026-10-16"], ["fridayclasslastlapjeopardy/", "The Last Lap Jeopardy", "A team quiz game.", "🏆", "2026-10-16"], ["fridayclasslastlapchloesphone/", "Chloe's Phone", "Unlock Chloe's phone.", "📱", "2026-10-16"]]], ["Nothing set in stone", "🪨", [["fridayconversationclass_nothingsetinstonerevision/", "What Does It Mean?", "Revise the expressions.", "🤔", "2026-09-11"], ["fridayclassnothingissetinstonerememberthe20/", "Remember the Twenty", "Remember all twenty expressions.", "🧠", "2026-09-03"], ["-fridayclassnothingissetinstonerevisiongames/", "Nothing Set in Stone: Games", "Revision games.", "🎲", "2026-09-03"], ["fridayclassthebusescape/", "The Last Bus", "An escape room game.", "🚌", "2026-09-03"]]], ["Finding your feet", "👣", [["findingyourfeetaskaround/", "Ask Around", "Ask your classmates.", "🙋", "2026-08-13"], ["findingyourfeetdebrief/", "Ask Around: The Debrief", "Talk about your answers.", "💬", "2026-08-13"], ["findingyourfeetrevision1/", "Guess It From Context", "Guess the meaning.", "🔍", "2026-08-06"], ["findingyourfeetspeaking1/", "Say It About You", "Use the expressions about you.", "🗣️", "2026-08-06"]]], ["Excursions", "📸", [["fridayclassmaritimeexcursion/", "The Great Harbour Hunt", "Our Maritime Museum excursion.", "⚓", "2026-09-14"], ["townhalldash/", "Town Hall City Dash", "The first city dash game.", "🏃", "2026-08-13"]]], ["Games and escape rooms", "🎲", [["samsfirstday/", "Locked Out! Sam's First Day", "An escape room in Sydney.", "🔐", "2026-07-30"], ["fridayclasstownhallexcursion/", "City Dash Adventure", "Town Hall and the QVB.", "🏛️", "2026-08-27"]]]];
var NEW_DAYS = 14;

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function isNew(d){var t=new Date(d+"T00:00:00");return (Date.now()-t.getTime())/864e5 <= NEW_DAYS;}
function card(a){
  return '<a class="card" href="'+esc(BASE+a[0])+'">'+
    (isNew(a[4])?'<span class="badge">NEW</span>':'')+
    '<span class="ico" aria-hidden="true">'+a[3]+'</span>'+
    '<span class="txt"><span class="t">'+esc(a[1])+'</span><span class="d">'+esc(a[2])+'</span></span>'+
    '<span class="go" aria-hidden="true">&#8250;</span></a>';
}
function sec(id,icon,name,items){
  return '<section id="'+id+'"><h2><span aria-hidden="true">'+icon+'</span>'+esc(name)+
    '<span class="n">'+items.length+(items.length===1?' activity':' activities')+'</span></h2>'+
    '<div class="grid">'+items.map(card).join("")+'</div></section>';
}
function render(){
  var chips=[], body=[];
  var fresh=[];
  SECTIONS.forEach(function(s){s[2].forEach(function(a){if(isNew(a[4]))fresh.push(a);});});
  fresh.sort(function(a,b){return a[4]<b[4]?1:-1;});
  if(fresh.length){
    chips.push('<a class="new" href="#newSec"><span aria-hidden="true">✨</span>New</a>');
    body.push(sec("newSec","✨","New activities",fresh));
  }
  SECTIONS.forEach(function(s,i){
    chips.push('<a href="#s'+i+'"><span aria-hidden="true">'+s[1]+'</span>'+esc(s[0])+'</a>');
    body.push(sec("s"+i,s[1],s[0],s[2]));
  });
  document.getElementById("chips").innerHTML=chips.join("");
  document.getElementById("list").innerHTML=body.join("");
}
render();

/* Auto update: activities.json is rebuilt every hour by the GitHub Action
   (.github/workflows/update-activities.yml) from every repo whose name starts
   with "fridayclass". Anything not already listed above is added here. */
(function autoAdd(){
  if(!window.fetch) return;
  fetch("activities.json?v="+Date.now(),{cache:"no-store"}).then(function(r){
    if(!r.ok) throw 0; return r.json();
  }).then(function(data){
    var have={};
    SECTIONS.forEach(function(s){s[2].forEach(function(a){have[a[0].replace(/\/$/,"").toLowerCase()]=1;});});
    var added=0;
    (data.items||[]).forEach(function(it){
      var key=String(it.repo).toLowerCase();
      if(have[key]) return;
      have[key]=1;
      var sNameLower=String(it.section).toLowerCase(), target=null;
      SECTIONS.forEach(function(s){if(s[0].toLowerCase()===sNameLower) target=s;});
      if(!target){
        target=[it.section,it.sectionEmoji||"🌟",[]];
        if(it.sectionTop) SECTIONS.unshift(target); else SECTIONS.push(target);
      }
      target[2].unshift([it.repo+"/",it.title,it.desc,it.emoji||"✨",it.date]);
      added++;
    });
    if(added) render();
  }).catch(function(){});
})();

(function size(){
  var KEY="hub-text-size-fridayclass", cur="1";
  try{cur=localStorage.getItem(KEY)||"1";}catch(e){}
  function set(v){
    document.documentElement.setAttribute("data-size",v);
    [].forEach.call(document.querySelectorAll(".size button"),function(b){b.setAttribute("aria-pressed",b.getAttribute("data-s")===v?"true":"false");});
    try{localStorage.setItem(KEY,v);}catch(e){}
  }
  set(cur);
  document.querySelector(".size").addEventListener("click",function(e){var b=e.target.closest("button");if(b)set(b.getAttribute("data-s"));});
})();
</script>
</body>
</html>
